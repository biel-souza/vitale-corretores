<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vitale - Sistema de Fila de Corretores</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <h1>🏢 Vitale Imóveis</h1>
        <p class="subtitle">Sistema de Gerenciamento de Fila de Corretores</p>
      </header>

      <!-- Formulário de Cadastro -->
      <section class="card">
        <h2>📝 Cadastrar Novo Corretor</h2>
        <form id="formCadastro">
          <div class="form-group">
            <label for="nome">Nome Completo</label>
            <input
              type="text"
              id="nome"
              name="nome"
              placeholder="Digite o nome do corretor"
              required
            />
          </div>
          <div class="form-group">
            <label for="telefone">Telefone</label>
            <input
              type="tel"
              id="telefone"
              name="telefone"
              placeholder="(00) 00000-0000"
              required
            />
          </div>
          <button type="submit" class="btn btn-primary">
            ➕ Cadastrar Corretor
          </button>
        </form>
      </section>

      <!-- Status da Fila -->
      <section class="card">
        <div class="section-header">
          <h2>📊 Status da Fila</h2>
          <button onclick="carregarFila()" class="btn btn-secondary btn-small">
            🔄 Atualizar
          </button>
        </div>
        <div id="statusFila" class="status-info">
          <p>Carregando...</p>
        </div>
      </section>

      <!-- Lista de Corretores -->
      <section class="card">
        <h2>👥 Corretores Cadastrados</h2>
        <div id="listaCorretores">
          <p class="loading">Carregando corretores...</p>
        </div>
      </section>

      <!-- Toast de Notificações -->
      <div id="toast" class="toast"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
