version: "3.8"

services:
  app:
    build: .
    container_name: vitale-app
    restart: always
    expose:
      - "3000"
    environment:
      PORT: 3000
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    networks:
      - n8n_default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      # HTTP Router (porta 80 para validação Let's Encrypt)
      - "traefik.http.routers.vitale-http.rule=Host(`vitale.h-talks.com.br`)"
      - "traefik.http.routers.vitale-http.entrypoints=web"
      - "traefik.http.routers.vitale-http.middlewares=vitale-redirect"
      # HTTPS Router (porta 443)
      - "traefik.http.routers.vitale.rule=Host(`vitale.h-talks.com.br`)"
      - "traefik.http.routers.vitale.entrypoints=websecure"
      - "traefik.http.routers.vitale.tls.certresolver=mytlschallenge"
      # Middleware de redirecionamento HTTP -> HTTPS
      - "traefik.http.middlewares.vitale-redirect.redirectscheme.scheme=https"
      # Load Balancer
      - "traefik.http.services.vitale.loadbalancer.server.port=3000"

networks:
  n8n_default:
    external: true
  web:
    external: true
